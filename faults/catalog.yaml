    symptoms:
      - {signal: did.BATTERY_VOLTAGE, direction: unstable, condition: 'intermittent drops that follow bumps or wet weather (inference)'}
      - {signal: sensor.can_bus_off_count, direction: up, condition: 'bus-off events when a CAN connector is intermittent (inference)'}
    needs: [did.BATTERY_VOLTAGE, sensor.can_bus_off_count]
    rating: {severity: 6, occurrence: 6, detectability: 6}
    detectable_now: true
