    symptoms:
      - {signal: did.VEHICLE_SPEED, direction: unstable, condition: ECU speed and sensor.gps_ground_speed disagree at steady speed (inference)}
      - {signal: sensor.gps_ground_speed, direction: unstable, condition: GPS speed used as reference against ECU speed}
