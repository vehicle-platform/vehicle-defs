  - id: TYR-003
    subsystem: wheels_tyres
    root_cause: Wheel bearing wear (play, rough rotation) from age, water ingress or impact
    symptoms:
      - {signal: derived.coast_down_rolling_resistance, direction: up, condition: higher drag with no brake cause (inference)}
      - {signal: sensor.imu_accel_z, direction: unstable, condition: speed-dependent vibration (inference)}
