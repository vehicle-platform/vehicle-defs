      - {ref: "Owner's Manual, Maintenance Fundamentals - Tires p.69 (file owner_CB300RK_AK) - Honda, 2020, https://www.bike-parts-honda.it/thumbs/pdf_url/img/owner_manuals/owner_CB300RK_AK/2500_2500/0071.pdf", confidence: medium}
