    rider_text: A connector may be corroded or loose, so equipment can cut out on bumps or in rain. Have the wiring checked soon.
    action: Open and inspect connectors for corrosion or water; clean, dry, and seal them.
    sources:
      - {ref: "How to cure electrical faults on your motorbike - Haynes, n.d., https://uk.haynes.com/blogs/tips-tutorials/how-to-cure-electrical-faults-on-your-motorbike", confidence: medium}
  - id: WIR-003
    subsystem: wiring
    root_cause: Chafed harness rubbing through insulation at a steering or frame rub point, causing a short or open circuit.
    symptoms:
      - {signal: did.BATTERY_VOLTAGE, direction: down, condition: 'sudden sag when the handlebar turns or a short occurs (inference)'}
