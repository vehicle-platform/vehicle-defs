  # unless the ref says otherwise; medium = Haynes, high = the DVSA MOT inspection manual ----
  - id: SUS-001
    subsystem: suspension_steering
    root_cause: Fork seal leak (cracked seal, grit under lip, or nicked fork tube) lets fork oil escape; damping falls and oil can reach the front brake.
    symptoms:
      - {signal: derived.road_roughness, direction: up, condition: 'rougher ride metric than baseline at same speed over weeks (inference)'}
      - {signal: sensor.imu_accel_z, direction: unstable, condition: 'extra rebound or bounce after bumps (inference)'}
    needs: [derived.road_roughness, sensor.imu_accel_z]
    rating: {severity: 8, occurrence: 6, detectability: 8}
    detectable_now: false
    # Direct sign is oil on the fork tube (visual only); IMU effect is indirect and weak.
    advise_stop: true
    rider_text: Oil may be leaking from your front fork. Fork oil on the brake can reduce stopping power. Stop somewhere safe and check the fork legs and brake for oil. Do not ride on until it is checked.
    action: Inspect fork tubes and brake pads and disc for oil; replace seals and clean or replace contaminated brake parts; check the tube for nicks.
    sources:
      - {ref: "How Do I Know If My Fork Seals Are Bad? - Risk Racing, n.d., https://riskracing.com/blogs/news/how-do-i-know-if-my-fork-seals-are-bad", confidence: low}
      - {ref: "6 Motorcycle Suspension Problems To Watch Out For - Haynes, n.d., https://us.haynes.com/blogs/tips-tutorials/6-motorcycle-suspension-problems-to-watch-out-for", confidence: medium}
      - {ref: "Leaking fork seals FAQs - Motorcyclist, n.d., https://www.motorcyclistonline.com/how-to/leaking-fork-seals-faqs/", confidence: low}
  - id: SUS-002
    subsystem: suspension_steering
    root_cause: Steering-head bearing worn, dry or wrongly adjusted; steering becomes notchy, stiff or loose.
    symptoms:
      - {signal: sensor.imu_gyro_z, direction: unstable, condition: 'yaw oscillation or wander at steady speed (inference)'}
      - {signal: did.VEHICLE_SPEED, direction: unstable, condition: 'oscillation present only in a speed band, not at standstill (inference)'}
    needs: [sensor.imu_gyro_z, did.VEHICLE_SPEED]
    rating: {severity: 9, occurrence: 4, detectability: 8}
    detectable_now: false
    # Notchiness and play are found only by hand with the front wheel raised; IMU wander is an indirect, weak sign.
    advise_stop: true
    rider_text: Your steering may be worn or loose. This can make the front end wander or shake. Stop somewhere safe and do not ride on until the steering is checked.
    action: Raise the front wheel, turn lock to lock for notchiness, check for play with the front brake applied; adjust or replace bearings.
    sources:
      - {ref: "MOT inspection manual for motorcycles, 2. Steering - GOV.UK (DVSA), n.d., https://gov.uk/guidance/mot-inspection-manual-for-motorcycles/2-steering", confidence: high}
      - {ref: "Five things that will ruin your motorcycle's handling - RevZilla Common Tread, n.d., https://www.cyclegear.com/common-tread/five-things-that-will-ruin-your-motorcycles-handling", confidence: low}
  - id: SUS-003
    subsystem: suspension_steering
    root_cause: Rear shock loses damping (oil leak, foaming or wear); rear bounces after bumps and squats under load.
    symptoms:
      - {signal: sensor.imu_accel_z, direction: unstable, condition: 'repeated oscillation after a single bump (inference)'}
      - {signal: derived.road_roughness, direction: up, condition: 'higher than baseline on the same road (inference)'}
    needs: [sensor.imu_accel_z, derived.road_roughness]
    rating: {severity: 7, occurrence: 6, detectability: 6}
    detectable_now: true
    advise_stop: true
    rider_text: Your rear suspension may have lost damping, so the rear can bounce and grip less, especially in bends and braking. Stop somewhere safe and have it checked before riding further.
    action: Inspect the shock for oil on the body; test by pushing the rear down and watching for repeated bounce; replace or rebuild the shock.
    sources:
      - {ref: "6 Motorcycle Suspension Problems To Watch Out For - Haynes, n.d., https://us.haynes.com/blogs/tips-tutorials/6-motorcycle-suspension-problems-to-watch-out-for", confidence: medium}
  - id: SUS-004
    subsystem: suspension_steering
    root_cause: Loose suspension, axle or steering fasteners (inference; no opened page covers torque loss on this bike).
    symptoms:
      - {signal: sensor.imu_accel_y, direction: unstable, condition: 'new lateral shake or rattle with speed (inference)'}
