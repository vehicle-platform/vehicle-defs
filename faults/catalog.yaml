      - {signal: derived.gear_estimate, direction: unstable, condition: estimated gear changes while throttle held and clutch not operated}
      - {signal: did.ENGINE_SPEED, direction: up, condition: engine speed jumps up sharply with no speed change}
      - {signal: derived.clutch_state, direction: absent, condition: no clutch lever action recorded around the event}
