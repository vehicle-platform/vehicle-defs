  - id: FUE-008
    subsystem: fuel_air
    root_cause: >-
      O2 sensor slow, drifting or with a failed heater (inference): the ECU loses reliable
      closed-loop feedback, so fuelling is corrected late or not at all. Fuel trims wander or
      saturate and warm-up/cruise mixture drifts.
    symptoms:
      - signal: did.SHORT_TERM_FUEL_TRIM_B1
        direction: unstable
        condition: Cruise or steady throttle after warm-up; trim swings slowly or sticks at a limit (inference).
      - signal: did.LONG_TERM_FUEL_TRIM_B1
        direction: up
        condition: Persistent large correction (either sign) once warm; learned value drifts away from zero (inference).
      - signal: did.COOLANT_TEMP
        direction: up
        condition: Engine fully warm, so closed loop should be active; used to gate the trim symptoms (inference).
      - signal: did.ENGINE_SPEED
        direction: unstable
        condition: Mild hunting at idle or light load when the mixture is off (inference).
    needs:
      - did.SHORT_TERM_FUEL_TRIM_B1
      - did.LONG_TERM_FUEL_TRIM_B1
      - did.COOLANT_TEMP
      - did.ENGINE_SPEED
    rating:
      severity: 4
      occurrence: 4
      detectability: 5
    detectable_now: false
    advise_stop: false
    rider_text: >-
      The exhaust oxygen sensor may be responding slowly or not heating, so the engine management
      cannot fine-tune the fuel mixture. You may notice higher fuel use, rough running or a
      check-engine light. Have the bike inspected soon.
    action: Read stored fault codes with a Honda-capable scan tool, check the sensor heater circuit and wiring, then replace the sensor if out of specification.
    # CONFIRM: the O2 sensor type/heater DTC list for the CL250 and whether slow-response is monitored; service manual only
    sources:
      - {ref: "SAE J2012 / ISO 15031-6 generic DTC P0130 'O2 Sensor Circuit (Bank 1 Sensor 1); the heater circuit code was not verified' as listed in public mirrors (https://www.iatn.net/techmail/summaries/2011/03/index-dtc.html, https://club.autodoc.co.uk/obd-codes/all). Supports only the generic code number and name, not a CL250 or Honda motorcycle behaviour; SAE text is paywalled; pages not opened (fetch blocked), read from search-result summaries (search-summary only, page not opened)", confidence: low}
      - ref: 'Honda Motorcycle Aftersales Plus One, DTC and PGM-FI diagnostics article - Honda Motor Co., 2025, https://global.honda/en/motorcycle-aftersales/plusone/202506.html (supports only: PGM-FI stores DTCs, scan tool recommended; failure behaviour here is inferred)'
        confidence: low
  - id: FUE-009
    subsystem: fuel_air
    root_cause: >-
      Idle air control or fast-idle valve fault (inference): stuck, clogged or electrically failed
      valve gives wrong idle speed, especially cold (fast idle missing) or hot (idle too high or
      hunting). Intake air leaks can mimic it.
    symptoms:
      - signal: did.ENGINE_SPEED
        direction: unstable
        condition: At idle, speed hunts or sits away from the target (high or low) with throttle closed (inference).
      - signal: derived.idle_rpm_std
        direction: up
        condition: Idle RPM standard deviation increases versus the healthy baseline (inference).
      - signal: did.THROTTLE_POS
        direction: absent
        condition: Throttle at closed position, so the idle error is not rider input (inference).
      - signal: did.COOLANT_TEMP
        direction: down
        condition: Cold start, when fast idle should raise the speed; low idle or stalling points to the valve (inference).
      - signal: did.INTAKE_MAP
        direction: unstable
        condition: Manifold pressure fluctuates at idle with the speed hunting (inference).
    needs:
      - did.ENGINE_SPEED
      - derived.idle_rpm_std
      - did.THROTTLE_POS
      - did.COOLANT_TEMP
      - did.INTAKE_MAP
    rating:
      severity: 5
      occurrence: 4
      detectability: 4
    detectable_now: false
    advise_stop: false
    rider_text: >-
      The engine idle may be unstable, too high or too low, and it may stall at stops or when cold.
      Stalling in traffic is a hazard, so take care at junctions and have the bike inspected soon.
    action: Check throttle body and idle air passages for deposits, intake leaks and the valve connector and wiring, then clean or replace the valve per the model service manual.
    # CONFIRM: whether the CL250 has an idle air control valve or a fast-idle valve at all (the entry is an inference); service manual only
    sources:
      - {ref: "SAE J2012 / ISO 15031-6 generic DTC P0505 'Idle Control System Malfunction' as listed in public mirrors (https://www.iatn.net/techmail/summaries/2011/03/index-dtc.html, https://club.autodoc.co.uk/obd-codes/all). Supports only the generic code number and name, not a CL250 or Honda motorcycle behaviour; SAE text is paywalled; pages not opened (fetch blocked), read from search-result summaries (search-summary only, page not opened)", confidence: low}
      - ref: 'Honda Motorcycle Aftersales Plus One, DTC and PGM-FI diagnostics article - Honda Motor Co., 2025, https://global.honda/en/motorcycle-aftersales/plusone/202506.html (supports only: PGM-FI stores DTCs; idle-valve failure behaviour is inferred)'
        confidence: low
