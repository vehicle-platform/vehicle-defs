    action: Check torque of fork pinch bolts, axle nuts, shock mounts and swingarm pivot to the manual values.
    sources:
      - {ref: "MOT inspection manual for motorcycles, 2. Steering - GOV.UK (DVSA), n.d., https://gov.uk/guidance/mot-inspection-manual-for-motorcycles/2-steering", confidence: high}
  - id: WIR-001
    subsystem: wiring
    root_cause: Corroded or loose ground connection; several circuits share one earth, so many items misbehave together.
    symptoms:
      - {signal: did.BATTERY_VOLTAGE, direction: unstable, condition: 'drops or flicker under load such as lights or indicators (inference)'}
      - {signal: sensor.can_rx_error_count, direction: up, condition: 'node resets or noisy supply causing errors (inference)'}
