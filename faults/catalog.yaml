    action: Inspect sprocket teeth and chain rollers; replace sprockets and chain together.
    sources:
      - {ref: "Owner's Manual, Drive Chain Rollers (file owner_CRF250RD_EN) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CRF250RD_EN/2500_2500/0100.pdf", confidence: low}
      # The page covers roller service limits (a different part); sprocket wear symptoms are inference.

  - id: BRK-001
    subsystem: brakes_abs
    root_cause: Brake pads worn to the limit (cutout reached); fluid reservoir level drops as pads wear
    symptoms:
      - {signal: derived.vehicle_accel, direction: down, condition: braking deceleration weaker than baseline for similar lever input (inference)}
    needs: [derived.vehicle_accel]
    rating: {severity: 9, occurrence: 5, detectability: 8}
    detectable_now: false
    advise_stop: true
    rider_text: The brake pads may be worn out and braking may be weak. Stop safely and have the brakes inspected before riding further.
    action: Replace pads as a set; check fluid level and discs.
    sources:
      - {ref: "Owner's Manual, Brake Pad Wear p.137 (file owner_CB1000RC_RAC_EN, CB1000R ABS) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CB1000RC_RAC_EN/2500_2500/0144.pdf", confidence: medium}
      - {ref: "Owner's Manual, Brakes fluid level p.136 (file owner_CB1000RC_RAC_EN) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CB1000RC_RAC_EN/2500_2500/0143.pdf", confidence: medium}
      # planned/unavailable sensor: pad thickness / brake pressure; deceleration is only the closest observable effect.

  - id: BRK-002
    subsystem: brakes_abs
    root_cause: Brake fluid low from leak (hoses, fittings, seals) or unexplained level drop
    symptoms:
      - {signal: derived.vehicle_accel, direction: down, condition: braking deceleration drops or lever feels spongy then weak (inference)}
    needs: [derived.vehicle_accel]
    rating: {severity: 10, occurrence: 3, detectability: 8}
    detectable_now: false
    advise_stop: true
    rider_text: Brake fluid may be low or leaking, and the brakes could fail. Stop safely, do not continue, and have the brakes inspected.
    action: Inspect hoses, fittings and calipers for leaks; refill and bleed only after the leak is fixed.
    sources:
      - {ref: "Owner's Manual, Brakes p.136 (file owner_CB1000RC_RAC_EN) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CB1000RC_RAC_EN/2500_2500/0143.pdf", confidence: medium}
      # The page says: level at/below LOWER mark -> check pads; if pads not worn, have the system inspected for leaks.
      # planned/unavailable sensor: brake fluid level / pressure.

  - id: BRK-003
    subsystem: brakes_abs
    root_cause: Air in the brake lines (after service or leak) giving soft lever and weaker braking
    symptoms:
      - {signal: derived.vehicle_accel, direction: down, condition: deceleration lower for the same lever travel (inference)}
    needs: [derived.vehicle_accel]
    rating: {severity: 9, occurrence: 3, detectability: 9}
    detectable_now: false
    advise_stop: true
    rider_text: The brake lever may feel soft, which means braking could be weak. Stop safely and have the brakes inspected and bled.
    action: Bleed the brake system and check for leaks.
    sources:
      - {ref: "Troubleshooting Motorcycle Brake Systems: Guide To Slowing Down - Ultimate Motorcycling, 2021, https://ultimatemotorcycling.com/2021/09/24/troubleshooting-motorcycle-brake-systems-guide-to-slowing-down/", confidence: low}
      # The opened page does not cover spongy lever; air-in-lines cause comes from search summary of other pages, so low.
      # planned/unavailable sensor: brake pressure.

  - id: BRK-004
    subsystem: brakes_abs
    root_cause: Warped or unevenly worn disc (thickness variation, hot spots from overheating)
    symptoms:
      - {signal: sensor.imu_accel_x, direction: unstable, condition: pulsating longitudinal acceleration during braking (inference)}
      - {signal: derived.vehicle_accel, direction: unstable, condition: deceleration oscillates at wheel-rotation rate (inference)}
    needs: [sensor.imu_accel_x, derived.vehicle_accel]
    rating: {severity: 7, occurrence: 4, detectability: 5}
    detectable_now: true
    advise_stop: true
    rider_text: The brakes may pulse, which suggests a warped disc or a sticking brake part. Stop safely and have the brakes inspected.
    action: Measure disc thickness and runout and check calipers before replacing discs.
    sources:
      - {ref: "Troubleshooting Motorcycle Brake Systems: Guide To Slowing Down - Ultimate Motorcycling, 2021, https://ultimatemotorcycling.com/2021/09/24/troubleshooting-motorcycle-brake-systems-guide-to-slowing-down/", confidence: low}
      # The page describes hot spots and thickness variation; the article does not use the term pulsation.
      # advise_stop kept true because all brakes_abs entries must have it.

  - id: BRK-005
    subsystem: brakes_abs
    root_cause: Sticking caliper piston or seized slider keeping the pad against the disc
    symptoms:
      - {signal: derived.coast_down_rolling_resistance, direction: up, condition: coast-down drag higher than baseline (inference)}
      - {signal: derived.vehicle_accel, direction: down, condition: acceleration lower than expected for throttle position at steady state (inference)}
      - {signal: did.THROTTLE_POS, direction: up, condition: more throttle needed to hold speed}
    needs: [derived.coast_down_rolling_resistance, derived.vehicle_accel, did.THROTTLE_POS]
    rating: {severity: 7, occurrence: 4, detectability: 6}
    detectable_now: true
    advise_stop: true
    rider_text: A brake may be dragging, which can overheat it and reduce braking. Stop safely and have the brakes inspected.
    action: Clean and lubricate slides, check piston retraction and replace seals if corroded.
    sources:
      - {ref: "Troubleshooting Motorcycle Brake Systems: Guide To Slowing Down - Ultimate Motorcycling, 2021, https://ultimatemotorcycling.com/2021/09/24/troubleshooting-motorcycle-brake-systems-guide-to-slowing-down/", confidence: low}
      # Page states pads stay in contact with the rotor and the outside pad wears faster.

  - id: BRK-006
    subsystem: brakes_abs
