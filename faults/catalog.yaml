  - id: CLU-001
    subsystem: clutch_gearbox
    root_cause: Clutch slip from worn friction plates, fatigued springs or wrong oil (friction modifiers)
    symptoms:
      - {signal: derived.clutch_slip_ratio, direction: up, condition: ratio rises under high throttle in higher gears while clutch lever is released (inference from Haynes symptom text)}
      - {signal: did.ENGINE_SPEED, direction: up, condition: revs climb without proportional speed gain under load}
      - {signal: did.VEHICLE_SPEED, direction: down, condition: speed rises less than engine speed implies under throttle}
      - {signal: did.THROTTLE_POS, direction: up, condition: throttle opened during the event}
    needs: [derived.clutch_slip_ratio, did.ENGINE_SPEED, did.VEHICLE_SPEED, did.THROTTLE_POS]
    rating: {severity: 5, occurrence: 5, detectability: 4}
    detectable_now: true
    advise_stop: false
    rider_text: The engine is revving but the bike is not speeding up as it should, which suggests the clutch is slipping. Avoid hard acceleration and have the clutch checked soon.
    action: Check clutch lever free play first, then inspect plates and springs and engine oil type at a workshop.
    sources:
      - {ref: "Top 6 Motorcycle Clutch Problems That Affect Riding Performance - Haynes, 2026, https://us.haynes.com/blogs/tips-tutorials/top-6-motorcycle-clutch-problems-that-affect-riding-performance", confidence: medium}

  - id: CLU-002
    subsystem: clutch_gearbox
    root_cause: Clutch drag from too little lever free play, stretched or kinked cable, warped plates or worn springs
    symptoms:
      - {signal: derived.clutch_state, direction: unstable, condition: state reads engaged-like or inconsistent while lever is pulled (inference)}
      - {signal: did.VEHICLE_SPEED, direction: up, condition: bike creeps or speed stays above zero in gear with lever pulled at standstill}
      - {signal: did.ENGINE_SPEED, direction: unstable, condition: engine speed dips or stalls when stopping in gear (inference)}
    needs: [derived.clutch_state, did.VEHICLE_SPEED, did.ENGINE_SPEED]
    rating: {severity: 4, occurrence: 5, detectability: 6}
    detectable_now: true
    advise_stop: false
    rider_text: The clutch may not be fully releasing, so the bike can creep or shift roughly. Have the clutch free play and cable checked soon.
    action: Check and adjust lever free play and inspect the cable for fraying or kinks before opening the clutch.
    sources:
      - {ref: "Top 6 Motorcycle Clutch Problems That Affect Riding Performance - Haynes, 2026, https://us.haynes.com/blogs/tips-tutorials/top-6-motorcycle-clutch-problems-that-affect-riding-performance", confidence: medium}
      - {ref: "Owner's Manual, Clutch System / Clutch Freeplay p.103 (file owner_VT750C2BA) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_VT750C2BA/2500_2500/0110.pdf", confidence: medium}

  - id: CLU-003
    subsystem: clutch_gearbox
    root_cause: Incorrect clutch lever free play or stretched cable causing premature clutch wear or poor engagement
    symptoms:
      - {signal: derived.clutch_slip_ratio, direction: up, condition: slip grows gradually over weeks of use (inference; trend only)}
      - {signal: did.ENGINE_SPEED, direction: unstable, condition: engagement points vary between shifts (inference)}
