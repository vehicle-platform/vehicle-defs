# Fault catalog (D-084): vehicle-independent, FMEA-style fault signatures. Schema draft:
# docs/ideas/physics-informed-anomaly.md section 2. Which entries apply to a vehicle is
# decided per vehicle (vehicle/cl250_faults.yaml, D-078).
#
# Entry keys: id (AAA-000, unique), subsystem, root_cause, symptoms [{signal, direction
# up|down|unstable|absent, condition, window?}], needs [signal], residual?, rating {severity,
# occurrence, detectability: 1-10}, detectable_now, advise_stop, rider_text, action,
# sources [{ref, confidence high|medium|low}]. Signal names: did.<DID name>,
# derived.<signal>, sensor.<sensor>; codegen refuses a signal defs does not define for an
# applied entry (invariant 2). An entry without a high/medium source is CONFIRM: generated
# `displayable: false`, never shown to a rider (D-084 item 5).

schema_version: 1

entries:
  - id: CHG-001
    # generic OBD P0562 (system voltage low) in third-party lists; not confirmed for the CL250
    subsystem: charging
    root_cause: Stator winding open or shorted (burnt phase); alternator output collapses
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: down
        condition: cruise, sags toward the battery rest level
      - signal: derived.charging_ripple
        direction: unstable
        condition: cruise, ripple uneven or lost
    needs: [did.BATTERY_VOLTAGE, did.ENGINE_SPEED, derived.charging_ripple]
    residual: charging.output_vs_rpm
    rating: {severity: 8, occurrence: 4, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: false
    advise_stop: true
    rider_text: >-
      The bike is no longer recharging its battery. It will run until the battery is drained and can then cut out without warning. Stop somewhere safe, switch off and have it inspected before riding again.
    action: >-
      Check the battery first, then test stator continuity and short to ground against the service manual values.
    sources:
      - {ref: "Partzilla blog, 'Diagnosing motorcycle charging problems', https://www.partzilla.com/blog/diagnosing-motorcycle-charging-problems (generic motorcycle); search summary only, not opened", confidence: low}
      - {ref: "J&P Cycles Common Tread, 'How to test your motorcycle's stator and regulator/rectifier', https://www.jpcycles.com/common-tread/how-to-test-your-motorcycles-stator-and-regulator-rectifier (generic); search summary only, not opened", confidence: low}

  - id: CHG-002
    # generic OBD P0562, unconfirmed for the CL250
    subsystem: charging
    root_cause: Regulator/rectifier failed open (no rectified output)
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: down
        condition: cruise, no rise when revved, stays near the rest voltage
    needs: [did.BATTERY_VOLTAGE, did.ENGINE_SPEED]
    residual: charging.output_vs_rpm
    rating: {severity: 8, occurrence: 5, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The bike is not charging. The battery will run flat and the engine may stop. Stop somewhere safe and have it inspected.
    action: >-
      Diode-test the regulator/rectifier with its connector unplugged; confirm the stator output first.
    sources:
      - {ref: "J&P Cycles Common Tread, 'How to test your motorcycle's stator and regulator/rectifier', https://www.jpcycles.com/common-tread/how-to-test-your-motorcycles-stator-and-regulator-rectifier (generic); search summary only, not opened", confidence: low}
      - {ref: "Partzilla blog, 'Diagnosing motorcycle charging problems', https://www.partzilla.com/blog/diagnosing-motorcycle-charging-problems (generic motorcycle); search summary only, not opened", confidence: low}

  - id: CHG-003
    # generic OBD P0563 (system voltage high), unconfirmed for the CL250
    subsystem: charging
    root_cause: Shunt regulator fails to limit the voltage (overcharge)
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: up
        condition: cruise, sustained high level rising with engine speed
    needs: [did.BATTERY_VOLTAGE, did.ENGINE_SPEED]
    residual: charging.output_vs_rpm
    rating: {severity: 7, occurrence: 3, detectability: 5} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The battery may be getting overcharged, which can damage it and the electrics. Stop safely and have the bike inspected before riding on.
    action: >-
      Measure the charging voltage at several engine speeds against the manual limit; replace the regulator/rectifier if out of range.
    sources:
      - {ref: "RevZilla Common Tread, 'How to check your motorcycle's battery and charging system', https://www.revzilla.com/common-tread/how-to-check-your-motorcycles-battery-and-charging-system (generic); search summary only, not opened", confidence: low}

  - id: CHG-004
    # the melted-connector cause is an inference of the research agent; an engine-case vibration correlation needs the planned vibration sensor (Q-025)
    subsystem: charging
    root_cause: Stator-to-regulator connector overheated or corroded (intermittent output)
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: unstable
        condition: cruise, dropouts worse under load or vibration
    needs: [did.BATTERY_VOLTAGE, did.ENGINE_SPEED]
    rating: {severity: 7, occurrence: 5, detectability: 5} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The charging wiring may have a poor or heat-damaged connection, so charging can cut in and out. Stop safely and have it inspected; do not keep riding on a bike that may lose charging.
    action: >-
      Inspect, clean or replace the connector and terminals; check the voltage drop across the connector under load.
    sources:
      - {ref: "Partzilla blog, 'Diagnosing motorcycle charging problems', https://www.partzilla.com/blog/diagnosing-motorcycle-charging-problems (generic motorcycle); search summary only, not opened", confidence: low}
      - {ref: "J&P Cycles Common Tread, 'How to test your motorcycle's stator and regulator/rectifier', https://www.jpcycles.com/common-tread/how-to-test-your-motorcycles-stator-and-regulator-rectifier (generic); search summary only, not opened", confidence: low}

  - id: CHG-005
    subsystem: charging
    root_cause: Poor ground or battery-terminal connection makes the charging voltage read low
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: down
        condition: warm idle, low although stator and regulator are fine
    needs: [did.BATTERY_VOLTAGE]
    rating: {severity: 6, occurrence: 5, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The electrical system is not charging properly because of a poor connection. Have it checked soon; if the lights dim or the engine stumbles, stop safely and have it inspected.
    action: >-
      Clean and tighten the battery and frame grounds; measure the ground-path voltage drop before replacing parts.
    sources:
      - {ref: "Partzilla blog, 'Diagnosing motorcycle charging problems', https://www.partzilla.com/blog/diagnosing-motorcycle-charging-problems (generic motorcycle); search summary only, not opened", confidence: low}

  - id: BAT-001
    subsystem: battery_starting
    root_cause: Aged or sulfated battery with low capacity
    symptoms:
      - signal: derived.cranking_dip
        direction: up
        condition: cranking, deep voltage sag
      - signal: derived.battery_rest_voltage
        direction: down
        condition: key on, low resting voltage
      - signal: did.ENGINE_SPEED
        direction: down
        condition: cranking, slow cranking
    needs: [derived.cranking_dip, derived.battery_rest_voltage, did.ENGINE_SPEED, did.BATTERY_VOLTAGE]
    rating: {severity: 5, occurrence: 8, detectability: 3} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The battery is weak and the bike may not start, especially when cold. Have the battery tested; if it keeps failing, have the charging system inspected too.
    action: >-
      Resting-voltage test, then a cranking test (RevZilla gives 9.6 V as the minimum while cranking); replace the battery if it fails.
    sources:
      - {ref: "RevZilla Common Tread, 'How to test a motorcycle battery', https://www.revzilla.com/common-tread/how-to-test-a-motorcycle-battery (generic); search summary only, not opened", confidence: low}
      - {ref: "RevZilla Common Tread, 'How to check your motorcycle's battery and charging system', https://www.revzilla.com/common-tread/how-to-check-your-motorcycles-battery-and-charging-system (generic); search summary only, not opened", confidence: low}

  - id: BAT-002
    # an absent starter current needs the planned battery-current sensor (ACS758, Wave 2)
    subsystem: battery_starting
    root_cause: Starter relay contacts worn or relay coil starved (click, no crank)
    symptoms:
      - signal: did.ENGINE_SPEED
        direction: absent
        condition: cranking, no rotation after the start request
      - signal: did.BATTERY_VOLTAGE
        direction: unstable
        condition: cranking, relay chatter without a deep dip
    needs: [did.ENGINE_SPEED, did.BATTERY_VOLTAGE]
    rating: {severity: 4, occurrence: 5, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The bike clicks but will not start. Do not keep pressing the button. Have the starting system inspected.
    action: >-
      Voltage-drop test across the relay terminals under load; check the relay coil supply.
    sources:
      - {ref: "Buell 2002 P3 service manual, starter voltage-drop procedure, https://www.manualslib.com/manual/1104139/Buell-2002-P3.html?page=264 (other brand); search summary only, not opened", confidence: low}
      - {ref: "RevZilla Common Tread, 'How to test a motorcycle battery', https://www.revzilla.com/common-tread/how-to-test-a-motorcycle-battery (generic); search summary only, not opened", confidence: low}

  - id: BAT-003
    # abnormal starter current needs the planned battery-current sensor
    subsystem: battery_starting
    root_cause: Starter motor worn (brushes, commutator) or seized
    symptoms:
      - signal: derived.cranking_dip
        direction: up
        condition: cranking, deeper and longer sag
      - signal: did.ENGINE_SPEED
        direction: down
        condition: cranking, slow or no turning
    needs: [derived.cranking_dip, did.ENGINE_SPEED, did.BATTERY_VOLTAGE]
    rating: {severity: 4, occurrence: 4, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The starter is struggling and the bike may fail to start. Have it inspected before relying on it.
    action: >-
      Check the battery and cables first; measure the voltage at the starter terminal while cranking; overhaul or replace the starter.
    sources:
      - {ref: "Buell 2002 P3 service manual, starter voltage-drop procedure, https://www.manualslib.com/manual/1104139/Buell-2002-P3.html?page=264 (other brand); search summary only, not opened", confidence: low}
      - {ref: "RevZilla Common Tread, 'How to test a motorcycle battery', https://www.revzilla.com/common-tread/how-to-test-a-motorcycle-battery (generic); search summary only, not opened", confidence: low}

  - id: BAT-004
    subsystem: battery_starting
    root_cause: Corroded or loose battery or starter cable (high resistance)
    symptoms:
      - signal: did.ENGINE_SPEED
        direction: down
        condition: cranking, slow despite a healthy resting voltage
      - signal: did.BATTERY_VOLTAGE
        direction: unstable
        condition: key on, flickers when loads switch
    needs: [did.ENGINE_SPEED, did.BATTERY_VOLTAGE, derived.battery_rest_voltage]
    rating: {severity: 5, occurrence: 6, detectability: 4} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      A poor battery connection can stop the bike starting or cut the power while riding. Have the terminals and cables inspected; if the bike has cut out, stop safely and get it checked.
    action: >-
      Measure the voltage drop from the battery post to the relay and to the starter while cranking; clean and tighten.
    sources:
      - {ref: "Buell 2002 P3 service manual, starter voltage-drop procedure, https://www.manualslib.com/manual/1104139/Buell-2002-P3.html?page=264 (other brand); search summary only, not opened", confidence: low}
      - {ref: "RevZilla Common Tread, 'How to test a motorcycle battery', https://www.revzilla.com/common-tread/how-to-test-a-motorcycle-battery (generic); search summary only, not opened", confidence: low}

  - id: BAT-005
    # the drain mechanism is unsourced; a current measurement needs the planned battery-current sensor
    subsystem: battery_starting
    root_cause: Parasitic drain or deeply discharged battery (engine stopped)
    symptoms:
      - signal: did.BATTERY_VOLTAGE
        direction: down
        condition: after stop with the key on, falls over time
    needs: [did.BATTERY_VOLTAGE, did.ENGINE_SPEED]
    rating: {severity: 3, occurrence: 6, detectability: 5} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The battery is running down while the engine is off. Have the electrics checked so it does not leave you unable to start.
    action: >-
      Test the resting voltage; measure the drain with an ammeter (or the planned current sensor).
    sources:
      - {ref: "RevZilla Common Tread, 'How to test a motorcycle battery', https://www.revzilla.com/common-tread/how-to-test-a-motorcycle-battery (generic); search summary only, not opened", confidence: low}

  - id: COL-001
    # generic OBD P0217 (engine overtemperature), unconfirmed for the CL250
    subsystem: cooling
    root_cause: Thermostat stuck closed
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: up
        condition: warm idle and cruise, rapid rise above normal
      - signal: derived.coolant_rate
        direction: up
        condition: warm-up, fast rate
    needs: [did.COOLANT_TEMP, derived.coolant_rate]
    rating: {severity: 9, occurrence: 3, detectability: 6} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The engine is overheating. Stop safely, switch off and let it cool. Do not ride on; have it inspected.
    action: >-
      Check the hose temperatures (the engine-to-radiator hose stays cool when the thermostat is stuck shut); replace the thermostat.
    sources:
      - {ref: "Visordown workshop, 'Overheating motorcycles - cause, effect and resolution', https://www.visordown.com/features/workshop/ (generic); search summary only, not opened", confidence: low}
      - {ref: "RideApart, 'Motorcycle cooling systems (Doctor Moto)', https://www.rideapart.com/features/253816/motorcycle-cooling-systems-doctor-moto/ (generic); search summary only, not opened", confidence: low}

  - id: COL-002
    # a fuel-trim symptom is an inference of the research agent and is left out
    subsystem: cooling
    root_cause: Thermostat stuck open (slow warm-up, runs cold)
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: down
        condition: cruise, never reaches the normal temperature
    needs: [did.COOLANT_TEMP]
    rating: {severity: 3, occurrence: 4, detectability: 5} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: false
    rider_text: >-
      The engine is not warming up properly. Not urgent, but have it checked soon as it raises fuel use and wear.
    action: >-
      Compare the warm-up curve with a normal one; replace the thermostat.
    sources:
      - {ref: "RideApart, 'Motorcycle cooling systems (Doctor Moto)', https://www.rideapart.com/features/253816/motorcycle-cooling-systems-doctor-moto/ (generic); search summary only, not opened", confidence: low}

  - id: COL-003
    # generic OBD P0480 (cooling fan control circuit), wording varies, unconfirmed for the CL250
    subsystem: cooling
    root_cause: Cooling fan not running (motor, fuse, relay or fan control)
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: up
        condition: warm idle or slow traffic, climbs and does not fall
      - signal: did.VEHICLE_SPEED
        direction: down
        condition: stationary or slow, no airflow
    needs: [did.COOLANT_TEMP, did.VEHICLE_SPEED]
    rating: {severity: 9, occurrence: 4, detectability: 6} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The cooling fan may not be working and the engine can overheat in traffic. Stop safely, switch off, let it cool and have it inspected.
    action: >-
      Check the fuse, relay, connector and fan motor; confirm the temperature signal; replace the failed part.
    sources:
      - {ref: "Visordown workshop, 'Overheating motorcycles - cause, effect and resolution', https://www.visordown.com/features/workshop/ (generic); search summary only, not opened", confidence: low}

  - id: COL-004
    # generic OBD P0217, unconfirmed for the CL250
    subsystem: cooling
    root_cause: Coolant level low from an external leak (hose, radiator, cap)
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: up
        condition: cruise, rises over trips as the level falls
      - signal: did.COOLANT_TEMP
        direction: unstable
        condition: warm idle, spikes as air pockets pass the sensor
    needs: [did.COOLANT_TEMP]
    rating: {severity: 9, occurrence: 4, detectability: 5} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      You may be losing coolant, which can cause overheating. Stop safely if the bike runs hot, and have it inspected before riding on.
    action: >-
      Check the level when cold; inspect the hoses, radiator and cap; pressure-test the system.
    sources:
      - {ref: "MotorcycleHabit, 'Why is my motorcycle leaking coolant', https://motorcyclehabit.com/why-is-my-motorcycle-leaking-coolant (generic); search summary only, not opened", confidence: low}
      - {ref: "Visordown workshop, 'Overheating motorcycles - cause, effect and resolution', https://www.visordown.com/features/workshop/ (generic); search summary only, not opened", confidence: low}

  - id: COL-005
    # a changed pump noise needs the planned engine-case vibration sensor (Q-025)
    subsystem: cooling
    root_cause: Water pump seal or impeller failure (leak or reduced flow)
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: up
        condition: cruise, rises with load although the fan runs
    needs: [did.COOLANT_TEMP]
    rating: {severity: 9, occurrence: 2, detectability: 6} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The engine may be overheating because the coolant is not circulating. Stop safely, switch off and have it inspected. Do not ride on.
    action: >-
      Look for weeping at the pump weep hole; pressure-test; replace the seal or the pump after ruling out the thermostat and the cap.
    sources:
      - {ref: "MotorcycleHabit, 'Why is my motorcycle leaking coolant', https://motorcyclehabit.com/why-is-my-motorcycle-leaking-coolant (generic); search summary only, not opened", confidence: low}
      - {ref: "RideApart, 'Motorcycle cooling systems (Doctor Moto)', https://www.rideapart.com/features/253816/motorcycle-cooling-systems-doctor-moto/ (generic); search summary only, not opened", confidence: low}

  - id: COL-006
    # generic OBD P0117/P0118 (ECT circuit low/high), unconfirmed for the CL250; the fuel-trim drift is an inference and is left out
    subsystem: cooling
    root_cause: Coolant temperature sensor open or shorted (false reading)
    symptoms:
      - signal: did.COOLANT_TEMP
        direction: absent
        condition: key on, stuck at a limit or missing
    needs: [did.COOLANT_TEMP]
    rating: {severity: 6, occurrence: 3, detectability: 3} # Claude/agent judgement, AIAG-VDA scales
    detectable_now: true
    advise_stop: true
    rider_text: >-
      The temperature reading is wrong, so the engine may run badly and you cannot trust the gauge. Have it inspected soon; stop safely if it overheats.
    action: >-
      Check the sensor resistance against the manual and the wiring and connector; replace the sensor.
    sources:
      - {ref: "RideApart, 'Motorcycle cooling systems (Doctor Moto)', https://www.rideapart.com/features/253816/motorcycle-cooling-systems-doctor-moto/ (generic); search summary only, not opened", confidence: low}

  # ---- research batch 2 (2026-11-11): ignition, fuel and air, lubrication; pages opened; a
  # medium source is a Honda owner's manual page of another model, everything else is low ----
  - id: IGN-001
    subsystem: ignition
    root_cause: Crankshaft position (CKP) sensor or its wiring gives no signal
    symptoms:
      - {signal: did.ENGINE_SPEED, direction: absent, condition: "cranking, RPM stays at 0 while the starter turns (engine cranks but does not start)"}
    needs: [did.ENGINE_SPEED]
    rating: {severity: 8, occurrence: 4, detectability: 3}
    detectable_now: true
    advise_stop: true
    rider_text: "The engine does not see its crank position, so it will not start or may cut out. Do not rely on it; stop safely and have it inspected."
    action: "Check CKP sensor connector and harness for chafing, corrosion and oil; compare sensor resistance and gap with the service manual; read any stored DTC with the Honda diagnostic tool."
    sources:
      - {ref: "Crankshaft/camshaft position sensors, symptoms and testing — Danny's Engine Portal, n.d., https://dannysengineportal.com/crankshaft-camshaft-position-sensors/", confidence: low}
      - {ref: "Troubleshooting 'Engine does not start or is hard to start' (lists faulty CKP sensor, ignition coil, spark plug, fuel pump) — Honda CRF250R owner's manual (other model, text read from the PDF), bike-parts.fr, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CRF250RJ_EN/2500_2500/0152.pdf", confidence: medium}

  - id: IGN-002
    subsystem: ignition
    root_cause: Intermittent CKP sensor or connector fault (heat or vibration sensitive), engine cuts out and restarts after cooling
    symptoms:
      - {signal: did.ENGINE_SPEED, direction: unstable, condition: "warm_idle or cruise, RPM suddenly drops to zero then recovers, or engine stalls hot and restarts after cooling"}
    needs: [did.ENGINE_SPEED]
    rating: {severity: 8, occurrence: 4, detectability: 5}
    detectable_now: true
    advise_stop: true
    rider_text: "The engine may suddenly cut out, which is dangerous in traffic or in a corner. Stop safely and have it inspected before riding again."
    action: "Log RPM while heating and wiggling the harness; inspect CKP connector pins and wiring; replace sensor if the signal drops out. Faults may not set a DTC."
    sources:
      - {ref: "Crankshaft/camshaft position sensors — Danny's Engine Portal, n.d., https://dannysengineportal.com/crankshaft-camshaft-position-sensors/ (states a sensor may work cold but fail hot; intermittent failures may not set a code; wiring problems very common)", confidence: low}
      - {ref: "Crankshaft position sensor: how it works, symptoms — Samarins, n.d., https://samarins.com/glossary/crank_sensor.html (car-focused: random stall then restart, RPM drop to zero on scan tool)", confidence: low}

  - id: IGN-003
    subsystem: ignition
    root_cause: Weak or failing ignition coil (single coil, so a failure means misfire on every cycle)
    symptoms:
      - {signal: derived.idle_rpm_std, direction: up, condition: "warm_idle, uneven idle from inconsistent spark"}
      - {signal: did.ENGINE_SPEED, direction: unstable, condition: "cruise under load, stutter or power loss that worsens under load"}
    needs: [derived.idle_rpm_std, did.ENGINE_SPEED]
    rating: {severity: 7, occurrence: 4, detectability: 4}
    detectable_now: true
    advise_stop: false
    rider_text: "The engine may stumble, lose power or be hard to start because the spark is weak. Do not keep riding on it; have the ignition coil and spark plug checked soon."
    action: "Check coil primary/secondary resistance against the service manual, inspect plug cap and wire, replace spark plug and coil as needed. On a single-cylinder engine a dead coil also means no start (inference from the CRF250R troubleshooting list)."
    sources:
      - {ref: "9 symptoms of a bad ignition coil — Identifix, n.d., https://www.identifix.com/blogs/9-symptoms-of-a-bad-ignition-coil/ (car-focused: misfire worse under load, rough idle, hard start)", confidence: low}
      - {ref: "Troubleshooting 'Engine does not start or is hard to start' — Honda CRF250R owner's manual (other model), https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CRF250RJ_EN/2500_2500/0152.pdf (lists faulty ignition coil, broken or shorted spark plug wire)", confidence: medium}

  - id: IGN-004
    subsystem: ignition
    root_cause: Fouled, worn or wrong-gap spark plug (or wrong heat range)
    symptoms:
      - {signal: derived.idle_rpm_std, direction: up, condition: "warm_idle, rough idle from intermittent misfire"}
      - {signal: did.ENGINE_SPEED, direction: unstable, condition: "cranking, longer cranking before it fires (inference: shows as slow RPM rise)"}
    needs: [derived.idle_rpm_std, did.ENGINE_SPEED]
    rating: {severity: 4, occurrence: 6, detectability: 4}
    detectable_now: true
    advise_stop: false
    rider_text: "A worn or dirty spark plug can make starting hard and the idle rough. Have the plug checked and replaced if needed."
    action: "Inspect plug condition, heat range and gap against the service manual; replace; check for oil or rich-mixture cause of fouling."
    sources:
      - {ref: "Troubleshooting 'Engine does not start or is hard to start' — Honda CRF250R owner's manual (other model), https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_CRF250RJ_EN/2500_2500/0152.pdf (lists fouled spark plug, incorrect plug heat range and gap, dirty air cleaner)", confidence: medium}
      - {ref: "9 symptoms of a bad ignition coil — Identifix, n.d., https://www.identifix.com/blogs/9-symptoms-of-a-bad-ignition-coil/ (hard start and rough idle from weak spark)", confidence: low}

  - id: IGN-005
    subsystem: ignition
    root_cause: Loose or corroded ignition-system connector or ground (inference), voltage drop while cranking or riding
    symptoms:
      - {signal: derived.cranking_dip, direction: up, condition: "cranking, deeper battery-voltage dip than normal (inference)"}
      - {signal: did.BATTERY_VOLTAGE, direction: unstable, condition: "cruise, voltage flicker coinciding with RPM glitches (inference)"}
