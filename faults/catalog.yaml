    action: Check free play with the Honda procedure at each service interval.
    sources:
      - {ref: "Owner's Manual, Clutch System / Clutch Freeplay p.103 (file owner_VT750C2BA) - Honda, 2020, https://www.bike-parts.fr/thumbs/pdf_url/img/owner_manuals/owner_VT750C2BA/2500_2500/0110.pdf", confidence: medium}
      # The page states improper freeplay can cause premature clutch wear; lever free play itself is not a platform signal.

  - id: CLU-004
    subsystem: clutch_gearbox
    root_cause: Gear jumping out of mesh from worn gear dogs, bent or worn shift fork, or worn shift quadrant/detent
    symptoms:
