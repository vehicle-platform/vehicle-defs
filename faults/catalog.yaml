    rating: {severity: 6, occurrence: 6, detectability: 5}
    detectable_now: true
    advise_stop: false
    rider_text: Your electrical system shows an unstable supply, which can make lights or instruments cut out. Have the battery and ground connections checked soon, and stop if the lights fail.
    action: Clean and tighten battery and frame ground points; test the earth with a jumper wire.
    sources:
      - {ref: "How to cure electrical faults on your motorbike - Haynes, n.d., https://uk.haynes.com/blogs/tips-tutorials/how-to-cure-electrical-faults-on-your-motorbike", confidence: medium}
  - id: WIR-002
