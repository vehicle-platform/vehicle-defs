# HARA scaffold (DRAFT, Q-006). Ratings are TBD for the user (D-046: no ASIL assigned yet).
#
# Schema (checked by scripts/check_requirements.py):
#   schema_version: 1
#   items:        [{id, name, description}]
#   safety_goals: [{id SG-NNN, text, derives_from: [D-xxx | Q-xxx | invariant-N]}]
#   hazards:      [{id HZ-NNN, item, hazard, operational_situation, effect, S, E, C, asil,
#                   safety_goal_id, source: [D-xxx | Q-xxx | invariant-N], candidate?}]
#     S in TBD|S0..S3, E in TBD|E0..E4, C in TBD|C0..C3, asil in TBD|QM|A|B|C|D.
#     candidate: true = plausible, but its mitigation is not recorded in a decision yet.

schema_version: 1

items:
  - {id: cornering_warning, name: "Cornering warning", description: "Layer 1 decision (tan theta against mu) on the M4 safety partition, D-041"}
  - {id: blind_spot_warning, name: "Blind-spot warning", description: "Radar based decision on the M4 with mirror LEDs, D-072 item 3"}
  - {id: immobilizer, name: "Immobilizer", description: "Latching relay in the starter-relay coil line, M4 owned, invariant 6"}
  - {id: led_ring_output, name: "LED ring output", description: "Safety output of the cornering warning, never driven by rt-core, D-072 item 5"}
  - {id: inter_core_mailbox, name: "Inter-core mailbox", description: "SRAM4 mailbox between the M7 (rt-core) and the M4, D-093"}

safety_goals:
  - {id: SG-001, text: "The cornering warning shall not show GREEN while the friction utilisation tan(theta)/mu is at or above the yellow threshold.", derives_from: [D-041, D-100, D-101]}
  - {id: SG-002, text: "When no usable lean source exists the cornering warning shall show UNAVAILABLE or DEGRADED, never GREEN.", derives_from: [D-042, D-100, invariant-3]}
  - {id: SG-003, text: "The blind-spot output shall not show side clear when the radar data is unavailable, and its turn-signal input shall not depend on a slow or QM channel.", derives_from: [D-072, D-075, invariant-3]}
  - {id: SG-004, text: "The immobilizer shall never lock or hold the starter while the engine runs.", derives_from: [invariant-6, D-082, D-097]}
  - {id: SG-005, text: "The immobilizer shall always be recoverable: default unlocked, a passive hidden bypass and a 10 s timeout to unlock.", derives_from: [invariant-6, D-097]}
  - {id: SG-006, text: "A dark or frozen LED ring shall never be readable as GREEN.", derives_from: [D-072]}
  - {id: SG-007, text: "A stale, mismatched or corrupted mailbox frame shall never be used as a fresh safety input.", derives_from: [D-093, D-026, D-005]}
  - {id: SG-008, text: "No QM, slow-channel or rt-core software fault shall cause, suppress or degrade a safety decision of the M4 beyond the recorded fallback.", derives_from: [invariant-3, invariant-4, D-072]}

