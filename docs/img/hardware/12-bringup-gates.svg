<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Bring-up gates in order: B0 desk mock, B1 bench power chain, B2 real firmware without a bus, the listen-only capture for Q-001, V0 ignition on engine off, V1 idling in a closed area, V2 static T0 set, V3 low-speed T1, then road tests T2 and T3; each gate names its pass criterion and which can be checked from a recorded session">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a37"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#1f2a37">Fig. 12 — Bring-up gates (HI §6): each passes before the next; grey = desk, green = bike</text>
  <text x="20" y="46" fill="#6b7280">`vehicle-server bringup &lt;session&gt; --gate B0|V0|V1` prints one line per criterion (also in the analyzer E view and the phone). Manual criteria stay manual.</text>

  <g font-size="11">
    <!-- row 1 desk -->
    <g transform="translate(30,80)">
      <rect width="170" height="90" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="10" y="20" font-weight="600" fill="#1f2a37">B0 · desk, mock firmware</text>
      <text x="10" y="40" fill="#1f2a37">native tests · phone gets v3/v4</text>
      <text x="10" y="54" fill="#1f2a37">telemetry + IMU · import session</text>
      <text x="10" y="76" fill="#067647">pass: report ok, IMU gaps 0 at rest</text>
    </g>
    <line x1="200" y1="125" x2="230" y2="125" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(230,80)">
      <rect width="170" height="90" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="10" y="20" font-weight="600" fill="#1f2a37">B1 · bench supply 12–14 V</text>
      <text x="10" y="40" fill="#1f2a37">power chain alone: fuse, TVS, buck</text>
      <text x="10" y="54" fill="#1f2a37">reverse the input once</text>
      <text x="10" y="76" fill="#067647">pass: 5 V stable, buck cool, no conduct</text>
    </g>
    <line x1="400" y1="125" x2="430" y2="125" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(430,80)">
      <rect width="170" height="90" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="10" y="20" font-weight="600" fill="#1f2a37">B2 · desk, real firmware</text>
      <text x="10" y="40" fill="#1f2a37">transceiver connected, no bus</text>
      <text x="10" y="76" fill="#067647">pass: stays in listen window, sends 0</text>
    </g>
    <line x1="600" y1="125" x2="630" y2="125" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(630,80)">
      <rect width="170" height="90" rx="5" fill="#ecfdf3" stroke="#067647" stroke-dasharray="5 3"/>
      <text x="10" y="20" font-weight="600" fill="#067647">§7.1 · listen-only capture</text>
      <text x="10" y="40" fill="#1f2a37">first contact with the bike, no TX</text>
      <text x="10" y="54" fill="#1f2a37">ignition on, then idling, 300 s each</text>
      <text x="10" y="76" fill="#067647">answers Q-001 before any poll</text>
    </g>
    <line x1="800" y1="125" x2="830" y2="125" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(830,80)">
      <rect width="150" height="90" rx="5" fill="#ecfdf3" stroke="#067647"/>
      <text x="10" y="20" font-weight="600" fill="#067647">V0 · ignition on, engine off</text>
      <text x="10" y="40" fill="#1f2a37">Y-cable in, unit powered, phone on</text>
      <text x="10" y="62" fill="#067647">pass: ECU present, 5 DIDs valid,</text>
      <text x="10" y="76" fill="#067647">no latch flags, no bus-off</text>
    </g>
    <!-- turn -->
    <path d="M905 170 L905 200 L95 200 L95 230" fill="none" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <!-- row 2 bike -->
    <g transform="translate(30,230)">
      <rect width="190" height="90" rx="5" fill="#ecfdf3" stroke="#067647"/>
      <text x="10" y="20" font-weight="600" fill="#067647">V1 · idling, closed area</text>
      <text x="10" y="40" fill="#1f2a37">first polling with the engine running</text>
      <text x="10" y="62" fill="#067647">pass: RPM follows a throttle blip,</text>
      <text x="10" y="76" fill="#067647">CAN health clean ≥ 5 min</text>
    </g>
    <line x1="220" y1="275" x2="250" y2="275" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(250,230)">
      <rect width="190" height="90" rx="5" fill="#ecfdf3" stroke="#067647"/>
      <text x="10" y="20" font-weight="600" fill="#067647">V2 · T0 static set</text>
      <text x="10" y="40" fill="#1f2a37">sleep current &lt; 1 mA, cranking,</text>
      <text x="10" y="54" fill="#1f2a37">idle, warm-up from cold</text>
      <text x="10" y="76" fill="#067647">pass: §7 measurements recorded</text>
    </g>
    <line x1="440" y1="275" x2="470" y2="275" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(470,230)">
      <rect width="200" height="90" rx="5" fill="#ecfdf3" stroke="#067647"/>
      <text x="10" y="20" font-weight="600" fill="#067647">V3 · T1 low speed 0–30 km/h, lot</text>
      <text x="10" y="40" fill="#1f2a37">CAN speed vs gear-ratio formula</text>
      <text x="10" y="54" fill="#1f2a37">ignition cut mid-session</text>
      <text x="10" y="76" fill="#067647">pass: deviation explained; gap in report</text>
    </g>
    <line x1="670" y1="275" x2="700" y2="275" stroke="#1f2a37" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(700,230)">
      <rect width="280" height="90" rx="5" fill="#ffffff" stroke="#6b7280" stroke-dasharray="5 3"/>
      <text x="10" y="20" font-weight="600" fill="#1f2a37">T2 / T3 road tests · only after V3</text>
      <text x="10" y="40" fill="#1f2a37">§8 rules: one tester, read-only, recording checked</text>
      <text x="10" y="54" fill="#1f2a37">before riding, full gear. T4 out of scope here.</text>
      <text x="10" y="76" fill="#6b7280">H755 build repeats B1/B2/V0/V1 with rt-core (§11)</text>
    </g>
  </g>
  <text x="30" y="350" font-size="11" fill="#1f2a37">At G1 (the first capture + V0/V1): verify the 35 slow-polled `verified: false` DIDs and the catalog candidates (D-068, D-059 probe env), record Q-001, measure the tester step gap and ECU round trip (D-058).</text>
  <text x="30" y="368" font-size="11" fill="#6b7280">Never two testers on the DLC; never a scan tool while the unit is plugged in. Firmware with a bypassed gate is never flashed.</text>
</svg>
