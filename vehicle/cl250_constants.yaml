  # ---- derived-signal thresholds and definition parameters (D-103) ----
  # Claude's recommendations (user, 2026-11-05: "use your recommended values, keep them
  # changeable, optimise them later with deep research"). All provisional: none is from the
  # CL250 manual or a measurement yet. Each `source` says why the value was picked and what
  # replaces it. QM only (D-070 item 5): no safety decision reads them. Shared names start
  # with `derived_`, single-signal names with the signal name.
  derived_operating_coolant_degc:
    value: 80.0
    unit: degC
    status: provisional
    source: "D-103 recommendation: W3_WARM_IDLE already uses 80 degC; a liquid-cooled single's thermostat opens at about 80-85 degC (generic); replace by the coolant plateau of the first rides"
  derived_cold_coolant_degc:
    value: 50.0
    unit: degC
    status: provisional
    source: "D-103 recommendation: the cold level of a thermal cycle, 30 K below derived_operating_coolant_degc as hysteresis; replace after the first cold starts"
  derived_idle_rpm_min:
    value: 1000.0
    unit: rpm
    status: provisional
    source: "D-103 recommendation: the same band as W3_WARM_IDLE (provisional there), around the ~1400 rpm idle of ideas/cl250-technical-baseline.md (CONFIRM); replace by the warm-idle band measured at V1"
  derived_idle_rpm_max:
    value: 1800.0
    unit: rpm
    status: provisional
    source: "D-103 recommendation: the same band as W3_WARM_IDLE (provisional there), around the ~1400 rpm idle of ideas/cl250-technical-baseline.md (CONFIRM); replace by the warm-idle band measured at V1"
  derived_moving_speed_min_kmh:
    value: 3.0
    unit: km/h
    status: provisional
    source: "D-103 recommendation: three steps of the ECU speed resolution (1 km/h); below = at rest"
  derived_throttle_closed_max_pct:
    value: 2.0
    unit: "%"
    status: provisional
    source: "D-103 recommendation: TPS noise floor at a closed throttle (generic); replace by the closed-throttle spread seen at V1"
  derived_throttle_load_min_pct:
    value: 10.0
    unit: "%"
    status: provisional
    source: "D-103 recommendation: throttle clearly open = driven (clutch slip, launch); generic"
  derived_gear_match_tolerance:
    value: 0.05
    unit: ""
    status: provisional
    source: "D-070 item 6 algorithm parameter (the gear estimate since defs v0.14.0, until now hand-written in vehicle-server formulas.py and rt-core derived_gear.h): a measured ratio within this relative distance of a gear's ratio is that gear; tighter than derived_gear_ratio_tolerance, which judges clutch engagement"
  derived_gear_ratio_tolerance:
    value: 0.06
    unit: ""
    status: provisional
    source: "D-103 recommendation: half the smallest gear step (gear_ratio_5 / gear_ratio_6 = 1.123, half of 12.3 %); a measured ratio farther than this from every gear = not engaged"
  derived_steady_speed_spread_kmh:
    value: 4.0
    unit: km/h
    status: provisional
    source: "D-103 recommendation: the W4_CRUISE stability band (+-2 km/h)"
  derived_steady_min_duration_ms:
    value: 10000
    unit: ms
    status: provisional
    source: "D-103 recommendation: the W4_CRUISE minimum duration"
  derived_gnss_speed_accuracy_max_mps:
    value: 0.3
    unit: m/s
    status: provisional
    source: "D-103 recommendation: a good 3D fix of a u-blox class receiver reports 0.05-0.2 m/s speed accuracy; above this the GNSS speed is not a reference"
  derived_calibration_speed_min_kmh:
    value: 30.0
    unit: km/h
    status: provisional
    source: "D-103 recommendation: the 1 km/h ECU speed resolution is 3.3 % at 30 km/h, below that it dominates a speed or radius calibration"
  shift_event_rpm_step_min_rpm:
    value: 500.0
    unit: rpm
    status: provisional
    source: "D-103 recommendation: the smallest gear step (12.3 %) at 4000 rpm is about 490 rpm; smaller RPM changes are throttle, not a shift"
  shift_event_window_ms:
    value: 500
    unit: ms
    status: provisional
    source: "D-103 recommendation: a typical clutch-and-lever shift lasts 200-500 ms (generic); replace after the first rides"
  shift_event_speed_change_max_kmh:
    value: 3.0
    unit: km/h
    status: provisional
    source: "D-103 recommendation: speed stays continuous through a shift; three ECU speed steps"
  launch_event_end_speed_kmh:
    value: 10.0
    unit: km/h
    status: provisional
    source: "D-103 recommendation: by 10 km/h a launch in gear 1 has the clutch engaged (generic)"
  braking_event_decel_min_mps2:
    value: 3.0
    unit: m/s2
    status: provisional
    source: "D-103 recommendation: about 0.3 g, above engine braking and normal deceleration (generic motorcycle braking literature: normal 2-4, strong above 5 m/s2)"
  braking_event_min_duration_ms:
