    source: "D-103 recommendation: below the 50 Hz Nyquist limit of the 10 ms IMU sample and the engine's first order at idle (about 23 Hz at 1400 rpm)"
  idle_map_residual_expected_kpa:
    value: 35.0
    unit: kPa
    status: provisional
    source: "D-103 recommendation: typical warm-idle MAP of a small single, 30-40 kPa (generic); replace by the W3_WARM_IDLE median of the first rides"
  heat_soak_delta_speed_max_kmh:
